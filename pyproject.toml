[project]
name = "asof-store"
dynamic = ["version"]
description = "asof store provides a simple and efficient way to store and retrieve data with versioning support. It allows users to save different versions of their data and access them as needed."
readme = "README.md"
authors = [{ name = "Louis Zhuang", email = "yzhuang@outlook.com" }]
requires-python = ">=3.14"
dependencies = ["pydantic>=2.14.1", "service-registrar"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
sql-sqlite = ["polars>=2", "adbc-driver-sqlite>=1.8"]
sql-postgres = ["polars>=2", "adbc-driver-postgresql>=1.8"]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
markers = ["integration: tests that depend on live external services"]

[dependency-groups]
dev = []

[tool.uv.sources]
service-registrar = { path = "../service-registrar", editable = true }

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"
