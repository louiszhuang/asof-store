[project]
name = "asof-store"
dynamic = ["version"]
description = "asof store provides a simple and efficient way to store and retrieve data with versioning support. It allows users to save different versions of their data and access them as needed."
readme = "README.md"
authors = [{ name = "Louis Zhuang", email = "yzhuang@outlook.com" }]
requires-python = ">=3.14"
dependencies = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
sql-sqlite = ["sqlalchemy>=2.1"]
sql-postgres = ["sqlalchemy>=2.1", "psycopg[binary]>=3.3"]
scraper = ["pydantic>=2.0", "zapros>=0.20.0"]
dev = ["pytest>=9"]

[project.scripts]
ass = "asof_store:main"

[tool.pytest.ini_options]
markers = ["integration: tests that depend on live external services"]

[dependency-groups]
dev = ["prek>=0.5.5", "ruff>=0.17.0", "ty>=0.0.86"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"
